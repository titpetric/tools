#!/usr/bin/env atkins
tasks:
  default:
    desc: "Format, test, install"
    cmds:
      - task: go:fmt
      - task: go:test
      - task: install

  install:
    desc: "Install splint into the environment"
    passthru: true
    cmds:
      # The module root is the library; the command is under cmd/splint, which
      # is what a PATH wants.
      - go install ./cmd/splint

  fix:
    desc: "Regenerate the formatter fixture from its input"
    cmds:
      # testdata/input is source that has never been formatted, and
      # testdata/golden is what it should come out as. This writes the copy in
      # between, so a change to the formatter can be read as a diff against
      # golden before golden is moved to match it.
      - rm -rf linters/imports/testdata/output
      - cp -r linters/imports/testdata/input linters/imports/testdata/output
      - go run ./cmd/splint fix -i linters/imports/testdata/output ./...
      - diff -ru linters/imports/testdata/golden linters/imports/testdata/output
