@startuml
top to bottom direction
set namespaceSeparator none
skinparam linetype ortho
skinparam packageStyle rectangle
skinparam component {
  ArrowColor #666666
}

package "titpetric/tools" {
  component "<b>worktree</b>\nShow workspace details" as github_com_titpetric_tools_worktree [[https://github.com/titpetric/tools/tree/main/worktree]]
}




@enduml

