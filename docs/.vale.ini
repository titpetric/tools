# The llm-slop style from titpetric/phpscript (.vale/styles), the same rules
# registry.cdn.si/vale carries. Every rule has level error, so vale exits
# non-zero on any finding. The tech vocabulary accepts the project terms.
StylesPath = .vale/styles
MinAlertLevel = suggestion
Vocab = tech

[*.md]
BasedOnStyles = llm-slop
