#!/usr/bin/env atkins
# The markdown is under data/ rather than docs/, which is why the shared mdox
# skill does not apply here.

vars:
  folder: data

tasks:
  default:
    desc: "Check the markdown formatting and language"
    cmds:
      - task: lint

  up:
    desc: "Bring up the docker env"
    cmds:
      - task: compose:up

  down:
    desc: "Bring down the docker env"
    cmds:
      - task: compose:down

  fmt:
    desc: "Write the markdown in one format"
    cmds:
      # --markdown keeps the fixer off the Go, and -i points it at the folder
      # the documents are in.
      - splint fix --markdown -i ${{ folder }} ./...

  lint:
    desc: "Lint the language with vale"
    cmds:
      # There is no formatting check: the formatter settles every question it
      # covers with no rule to configure, so a check would only report a file
      # nobody had run the formatter over.
      - docker run --rm -v $(pwd):/docs -w /docs jdkato/vale .

  setup:
    desc: "Install splint, which formats the markdown"
    cmds:
      - go install github.com/titpetric/tools/splint@latest
